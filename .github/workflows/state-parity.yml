name: Check main state against a fresh measurement

# Every night, measure a rotating sample of about 32 source files of the main commit the
# `state` branch describes, with nothing carried over, and require each result to equal the
# published record (one compiler runner; every file is covered once in 102 nights). Started
# by hand with `full`, measure every source file (about 104 compiler runners) and require the
# whole result to equal the published state byte for byte. Any difference opens the alarm
# issue "Incremental state differs from a full recompute". Uses the same tools as every push
# (ci/managed-state/). Only the measuring job needs the compiler image.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Measure every source file (about 104 compiler runners) instead of the nightly sample'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: bfme-state-parity
  cancel-in-progress: false

jobs:
  target:
    if: >-
      github.repository == 'Open-BFME/BFME2-Rebuild' && github.ref == 'refs/heads/main' &&
      vars.BFME_STATE_WORKFLOW_ENABLED == 'yes' && vars.BFME_STATE_BRANCH_ENABLED == 'yes'
    name: Choose the commit and plan the measurement
    runs-on: '${{ vars.BFME_STATE_PUBLISH_RUNNER || ''ubuntu-24.04'' }}'
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: '${{ steps.target.outputs.sha }}'
      tree: '${{ steps.tree.outputs.tree }}'
      batches: '${{ steps.plan.outputs.batches }}'
      mode: '${{ steps.plan.outputs.mode }}'
    steps:
      - name: Check out the tools from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          path: tools-main
          persist-credentials: false
          sparse-checkout: |
            ci/state
            ci/managed-state
      - name: Read the main commit the state branch describes
        id: target
        shell: bash
        env:
          READ_TOKEN: '${{ github.token }}'
        run: |
          set -euo pipefail
          (cd tools-main/ci/state && sha256sum -c --quiet bundle.sha256) || { echo "::error::expected ci/state to match its bundle.sha256, found a difference"; exit 1; }
          python3 -B tools-main/ci/state/parity.py target
      - name: Check out that commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ steps.target.outputs.sha }}'
          path: at-main
          persist-credentials: false
      - name: Read its tree
        id: tree
        shell: bash
        working-directory: at-main
        env:
          SHA: '${{ steps.target.outputs.sha }}'
        run: |
          set -euo pipefail
          tree=$(git rev-parse --verify "$SHA^{tree}") || { echo "::error::expected main commit $SHA, found it missing"; exit 1; }
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - name: Plan the sample or the full measurement
        id: plan
        shell: bash
        working-directory: at-main
        env:
          TARGET: '${{ steps.target.outputs.sha }}'
          FULL: '${{ inputs.full }}'
          STATE_BUDGET: '${{ vars.BFME_STATE_BUDGET_JOBS }}'
        run: |
          set -euo pipefail
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          mkdir "$RUNNER_TEMP/state-plan"
          if [ "$FULL" = "true" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            GITHUB_SHA="$TARGET" python3 -B ci/managed-state/state_workflow.py plan "$RUNNER_TEMP/state-plan/state-plan.json"
          else
            echo "mode=sample" >> "$GITHUB_OUTPUT"
            python3 -B ../tools-main/ci/state/parity.py sample-plan --checkout . --main "$TARGET" \
              --day "$(date -u +%F)" --out "$RUNNER_TEMP/state-plan/state-plan.json"
            echo "batches=[0]" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-parity-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/state-plan'
          retention-days: 2
          if-no-files-found: error

  measure:
    needs: target
    name: Measure batch ${{ matrix.batch }}
    runs-on: boat-small/from=bfme2-compiler-v1
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        batch: '${{ fromJSON(needs.target.outputs.batches) }}'
    permissions:
      contents: read
    steps:
      - name: Wait for runner filesystem hydration
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          runner_grace=$((SECONDS + 15))
          waited=0
          while true; do
            pending=$(awk '
              {
                for (i = 7; i <= NF - 2; i++) {
                  if ($i == "-") {
                    if ($(i + 1) ~ /^fuse(\.|$)/ && ($(i + 1) ~ /^fuse\.ascii-lazyfs(-|$)/ || $(i + 2) ~ /^ascii-lazyfs(-|$)/) && $5 !~ /^\/var\/lib\/ascii-lazy\/retired(\/|$)/) {
                      print $5
                    }
                    break
                  }
                }
              }
            ' /proc/self/mountinfo)
            if [ -z "$pending" ]; then
              if [ "$waited" -eq 1 ]; then
                printf 'Runner filesystem hydration finished after %ss.\n' "$SECONDS"
              fi
              exit 0
            fi
            home_dir="${HOME%/}"
            if [ -n "$home_dir" ] && [ "$pending" = "$home_dir" ] \
              && [ "${pending#/opt/boat-compiler}" = "$pending" ] \
              && [ "${pending#/var/}" = "$pending" ] \
              && [ "${pending#/usr}" = "$pending" ] \
              && [ "$SECONDS" -ge "$runner_grace" ]; then
              printf 'Proceeding after %ss with persistent lazy mount %s (all other mounts retired).\n' "$SECONDS" "$home_dir"
              exit 0
            fi
            waited=1
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Expected lazy runner mounts to retire within 90s; still mounted:\n%s\n' "$pending" >&2
              exit 1
            fi
            sleep 0.5
          done
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ needs.target.outputs.sha }}'
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-parity-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/state-input'
      - name: Verify the comparison tools and compiler image
        shell: bash
        run: |
          set -euo pipefail
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          (cd ci/managed-nt2 && sha256sum -c --quiet bundle.sha256)
          cd /opt/boat-compiler
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
      - name: Measure the assigned source files
        shell: bash
        env:
          BATCH: '${{ matrix.batch }}'
          TARGET: '${{ needs.target.outputs.sha }}'
        run: |
          set -euo pipefail
          test -z "${GITHUB_TOKEN:-}"
          env -i PATH=/usr/bin:/bin HOME="$HOME" LANG=C LC_ALL=C GITHUB_SHA="$TARGET" TMPDIR="$RUNNER_TEMP" \
            python3 -B ci/managed-state/compare_main.py "$RUNNER_TEMP/state-input/state-plan.json" \
              "$BATCH" "$RUNNER_TEMP/state-shard-$BATCH.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bfme-state-${{ github.run_attempt }}-shard-${{ matrix.batch }}
          path: '${{ runner.temp }}/state-shard-${{ matrix.batch }}.json'
          retention-days: 2
          if-no-files-found: error

  compare:
    needs: [target, measure]
    name: Compare with the published state
    runs-on: '${{ vars.BFME_STATE_PUBLISH_RUNNER || ''ubuntu-24.04'' }}'
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: '${{ steps.compare.outputs.result }}'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ needs.target.outputs.sha }}'
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bfme-parity-plan-${{ github.run_attempt }}
          path: '${{ runner.temp }}/state-input'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: bfme-state-${{ github.run_attempt }}-shard-*
          path: '${{ runner.temp }}/state-shards'
          merge-multiple: false
      - name: Join the full recompute
        if: needs.target.outputs.mode == 'full'
        shell: bash
        env:
          TARGET: '${{ needs.target.outputs.sha }}'
        run: |
          set -euo pipefail
          (cd ci/managed-state && sha256sum -c --quiet bundle.sha256)
          GITHUB_SHA="$TARGET" python3 -B ci/managed-state/state_workflow.py assemble \
            "$RUNNER_TEMP/state-input/state-plan.json" "$RUNNER_TEMP/state-shards" "$RUNNER_TEMP/full-state.json"
      - name: Check out the comparison tool from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          path: tools-main
          persist-credentials: false
          sparse-checkout: |
            ci/state
            ci/managed-state
      - name: Require equality with the published state
        id: compare
        shell: bash
        env:
          READ_TOKEN: '${{ github.token }}'
          TARGET: '${{ needs.target.outputs.sha }}'
          TREE: '${{ needs.target.outputs.tree }}'
          MODE: '${{ needs.target.outputs.mode }}'
          ATTEMPT: '${{ github.run_attempt }}'
        run: |
          set -euo pipefail
          (cd tools-main/ci/state && sha256sum -c --quiet bundle.sha256)
          if [ "$MODE" = full ]; then
            python3 -B tools-main/ci/state/parity.py compare --snapshot "$RUNNER_TEMP/full-state.json" \
              --main "$TARGET" --tree "$TREE" --report "$RUNNER_TEMP/parity.txt"
          else
            python3 -B tools-main/ci/state/parity.py compare-sample \
              --shard "$RUNNER_TEMP/state-shards/bfme-state-$ATTEMPT-shard-0/state-shard-0.json" \
              --main "$TARGET" --report "$RUNNER_TEMP/parity.txt"
          fi

  alarms:
    needs: [target, measure, compare]
    if: always() && github.ref == 'refs/heads/main' && needs.target.result != 'skipped'
    name: Open or close the parity alarm
    runs-on: '${{ vars.BFME_STATE_PUBLISH_RUNNER || ''ubuntu-24.04'' }}'
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: ci/alarms
      - name: Set the parity alarm
        shell: bash
        env:
          ALARM_TOKEN: '${{ github.token }}'
          RESULT: '${{ needs.compare.outputs.result }}'
          MODE: '${{ needs.target.outputs.mode }}'
          JOBS: 'target=${{ needs.target.result }} measure=${{ needs.measure.result }} compare=${{ needs.compare.result }}'
          TARGET: '${{ needs.target.outputs.sha }}'
          RUN_URL: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
        run: |
          set -euo pipefail
          (cd ci/alarms && sha256sum -c --quiet bundle.sha256) || { echo "::error::expected ci/alarms to match its bundle.sha256, found a difference"; exit 1; }
          echo "Parity (${MODE:-unknown}): result=${RESULT:-none} jobs: $JOBS"
          case "$RESULT" in
            equal) python3 -B ci/alarms/alarm.py clear state-parity --run-url "$RUN_URL" ;;
            inconclusive) echo "No comparable published state for $TARGET; the alarm is left as it is." ;;
            differs) python3 -B ci/alarms/alarm.py raise state-parity --run-url "$RUN_URL" \
                       --detail "Expected the fresh ${MODE:-} measurement of main $TARGET to equal the state branch, found differences. The run log lists the first files." ;;
            *) python3 -B ci/alarms/alarm.py raise state-parity --run-url "$RUN_URL" \
                 --detail "Expected the fresh ${MODE:-} measurement of main ${TARGET:-unknown} to complete, found: $JOBS" ;;
          esac

name: BFME II landing rehearsal

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number for a read-only rehearsal
        required: true
        type: string

permissions: {}

jobs:
  rehearse:
    if: github.repository == 'Open-BFME/BFME2-Rebuild' && github.ref == 'refs/heads/main'
    runs-on: boat-small/from=bfme2-compiler-v1
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
      statuses: read
      actions: read
    env:
      BFME_PR: '${{ inputs.pr_number }}'
    steps:
      - name: Wait for runner filesystem hydration
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          runner_grace=$((SECONDS + 15))
          waited=0
          while true; do
            pending=$(awk '
              {
                for (i = 7; i <= NF - 2; i++) {
                  if ($i == "-") {
                    if ($(i + 1) ~ /^fuse(\.|$)/ && ($(i + 1) ~ /^fuse\.ascii-lazyfs(-|$)/ || $(i + 2) ~ /^ascii-lazyfs(-|$)/) && $5 !~ /^\/var\/lib\/ascii-lazy\/retired(\/|$)/) {
                      print $5
                    }
                    break
                  }
                }
              }
            ' /proc/self/mountinfo)
            if [ -z "$pending" ]; then
              if [ "$waited" -eq 1 ]; then
                printf 'Runner filesystem hydration finished after %ss.\n' "$SECONDS"
              fi
              exit 0
            fi
            home_dir="${HOME%/}"
            if [ -n "$home_dir" ] && [ "$pending" = "$home_dir" ] \
              && [ "${pending#/opt/boat-compiler}" = "$pending" ] \
              && [ "${pending#/var/}" = "$pending" ] \
              && [ "${pending#/usr}" = "$pending" ] \
              && [ "$SECONDS" -ge "$runner_grace" ]; then
              printf 'Proceeding after %ss with persistent lazy mount %s (all other mounts retired).\n' "$SECONDS" "$home_dir"
              exit 0
            fi
            waited=1
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Expected lazy runner mounts to retire within 90s; still mounted:\n%s\n' "$pending" >&2
              exit 1
            fi
            sleep 0.5
          done
      - name: Read exact protected landing tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: '${{ github.sha }}'
          persist-credentials: false
          sparse-checkout: |
            ci/managed-check
            ci/managed-nt2
            tools/gates
      - name: Read current head statuses and identify their protected producers
        id: source
        shell: bash
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
        run: |
          set -Eeuo pipefail
          trap 'printf "%s\n" "Landing discovery expected a verified protected bundle and three current checks. Found a refused or unavailable input." >&2' ERR
          (cd ci/managed-check && sha256sum -c --quiet bundle.sha256)
          python3 -B ci/managed-check/landing_read.py discover "$RUNNER_TEMP/bfme-landing"
      - name: Download the successful match receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: '${{ github.token }}'
          run-id: '${{ steps.source.outputs.match_run }}'
          name: bfme-report-${{ steps.source.outputs.match_attempt }}
          path: '${{ runner.temp }}/bfme-landing/match'
      - name: Download the measured inline result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: '${{ github.token }}'
          run-id: '${{ steps.source.outputs.match_run }}'
          name: bfme-inline-report-${{ steps.source.outputs.match_attempt }}
          path: '${{ runner.temp }}/bfme-landing/inline'
      - name: Download the published source rules receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: '${{ github.token }}'
          run-id: '${{ steps.source.outputs.rules_run }}'
          name: bfme-source-receipt-${{ steps.source.outputs.rules_attempt }}
          path: '${{ runner.temp }}/bfme-landing/rules'
      - name: Verify all three receipts and the latest exact-head review
        shell: bash
        env:
          BFME_READ_TOKEN: '${{ github.token }}'
          BFME_MAINTAINER_IDS: '${{ vars.BFME_MAINTAINER_IDS }}'
        run: python3 -B ci/managed-check/landing_read.py verify "$RUNNER_TEMP/bfme-landing"


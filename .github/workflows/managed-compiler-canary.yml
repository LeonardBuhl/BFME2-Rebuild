name: BFME II managed compiler canary

on:
  workflow_dispatch:

permissions: {}

jobs:
  managed-compiler-canary:
    runs-on: boat-small/from=bfme2-compiler-v1
    timeout-minutes: 8
    steps:
      - name: Wait for runner filesystem hydration
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          runner_grace=$((SECONDS + 15))
          waited=0
          while true; do
            pending=$(awk '
              {
                for (i = 7; i <= NF - 2; i++) {
                  if ($i == "-") {
                    if ($(i + 1) ~ /^fuse(\.|$)/ && ($(i + 1) ~ /^fuse\.ascii-lazyfs(-|$)/ || $(i + 2) ~ /^ascii-lazyfs(-|$)/) && $5 !~ /^\/var\/lib\/ascii-lazy\/retired(\/|$)/) {
                      print $5
                    }
                    break
                  }
                }
              }
            ' /proc/self/mountinfo)
            if [ -z "$pending" ]; then
              if [ "$waited" -eq 1 ]; then
                printf 'Runner filesystem hydration finished after %ss.\n' "$SECONDS"
              fi
              exit 0
            fi
            home_dir="${HOME%/}"
            if [ -n "$home_dir" ] && [ "$pending" = "$home_dir" ] \
              && [ "${pending#/opt/boat-compiler}" = "$pending" ] \
              && [ "${pending#/var/}" = "$pending" ] \
              && [ "${pending#/usr}" = "$pending" ] \
              && [ "$SECONDS" -ge "$runner_grace" ]; then
              printf 'Proceeding after %ss with persistent lazy mount %s (all other mounts retired).\n' "$SECONDS" "$home_dir"
              exit 0
            fi
            waited=1
            if [ "$SECONDS" -ge "$deadline" ]; then
              printf 'Expected lazy runner mounts to retire within 90s; still mounted:\n%s\n' "$pending" >&2
              exit 1
            fi
            sleep 0.5
          done
      - name: Verify sealed compiler image and local entry
        shell: bash
        run: |
          set -euo pipefail
          cd /opt/boat-compiler
          printf '%s  %s\n' \
            154f0ee3f79f129b5d2e09adaef61dd2fab208040bff6b64e7fb0e182181dcf6 image-inventory.json \
            e1f176db430a157b71cfb2f1adffbe5d0464aecb25f7e8796a83e015232ba0e3 worker.json \
            88888c03f6f12eedd455273f0cd131ef7637dba66f83503bf29ed89544b208ab /usr/local/libexec/bfme2-compiler/managed_probe.py \
            3c5253ceace321aa6855d5f313a951f2db79ab00cbb06bcd78c0c80d08fa7630 /usr/local/libexec/bfme2-compiler/run | sha256sum -c --quiet
          sudo -n sha256sum -c --quiet input.sha256 runtime-files.sha256
          umask 077
          t=$(mktemp -d)
          trap 'rm -f -- "$t"/{probe,request,reply}.json; rmdir -- "$t"' EXIT
          sudo -n systemd-tmpfiles --create /etc/tmpfiles.d/boat-compiler.conf
          sudo -n env GITHUB_TOKEN=canary-supervisor-sentinel ACTIONS_RUNTIME_TOKEN=canary-runtime-sentinel \
            /usr/local/libexec/bfme2-compiler/run probe > "$t/probe.json"
          PYTHONPATH=/opt/boat-compiler/guard python3 -B - "$t" <<'PY'
          from pathlib import Path
          import json, sys
          from pool_protocol import digest, encode, pack_sources
          from pool_worker import json_bytes
          root = Path(sys.argv[1])
          profile = digest(Path("/opt/boat-compiler/worker.json").read_bytes())
          probe = json.loads((root / "probe.json").read_bytes())
          assert probe["profile"] == profile
          assert probe["image_inventory_verified"]
          assert all(probe["checks"][x] for x in (
              "private_paths_absent", "private_mounts_absent", "credential_environment_absent",
              "network_sockets_denied", "network_namespace_private", "unprivileged_compiler",
              "no_inherited_network_descriptors", "no_new_privileges"))
          sources = {
              "src/openbfme_canary.cpp": b'#include "canary_headEr.h"\nextern "C" int canary_value() { return CANARY_VALUE; }\n',
              "src/openbfme_canary_error.cpp": b"#error isolated synthetic diagnostic\n",
              "include/canary_header.h": b"#define CANARY_VALUE 17\n",
          }
          flags = ["-nologo", "-c", "-showIncludes", "-Iinclude"]
          env = {"WINEPATH": ["vc/Vc7/bin", "vc/Common7/IDE", "vcruntime"]}
          plan = [{"tu": tu, "source": digest(sources[tu]), "flags": flags, "env": env,
                   "contract": digest(json_bytes([flags, env, tu]))}
                  for tu in ("src/openbfme_canary.cpp", "src/openbfme_canary_error.cpp")]
          (root / "request.json").write_bytes(json_bytes(
              {"version": 1, "profile": profile, "source": pack_sources({k: encode(v) for k, v in sources.items()}),
               "plan": plan}))
          PY
          sudo -n env GITHUB_TOKEN=canary-supervisor-sentinel \
            /usr/local/libexec/bfme2-compiler/run compile < "$t/request.json" > "$t/reply.json"
          PYTHONPATH=/opt/boat-compiler/guard python3 -B - "$t" <<'PY'
          from pathlib import Path
          import json, sys
          from pool_protocol import check_object, decode, digest, MAX_OBJECT
          root = Path(sys.argv[1])
          response = (root / "reply.json").read_bytes()
          assert b"canary-supervisor-sentinel" not in response
          record = json.loads(response)
          assert record["request"] == digest((root / "request.json").read_bytes())
          good, failure = record["results"]
          assert good["status"] == "compiled"
          assert check_object(decode(good["artifact"], MAX_OBJECT)) == good["sha256"]
          assert good["includes"] == [["source", "include/canary_header.h", digest(b"#define CANARY_VALUE 17\n")]]
          assert failure["status"] == "error" and "C1189" in failure["diagnostics"]
          assert "isolated synthetic diagnostic" not in failure["diagnostics"]
          print("Sealed compiler, source dependency and bounded diagnostic verified.")
          PY
